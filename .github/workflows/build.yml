
name: Deploy Alavi Portal

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Alavi Portal
        run: |
          mkdir extracted
          unzip -q Alavi-Portal-Supabase-connected.zip -d extracted
          mkdir _site

          INDEX=$(find extracted -type f -name index.html -print -quit)

          if [ -z "$INDEX" ]; then
            echo "index.html not found in ZIP"
            exit 1
          fi

          SITE_DIR=$(dirname "$INDEX")
          cp -a "$SITE_DIR/." _site/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
