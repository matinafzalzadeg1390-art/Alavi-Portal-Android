
name: Build Alavi Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "Alavi Portal Presentation.zip"
      - ".github/workflows/deploy.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          mkdir extracted
          unzip -q "Alavi Portal Presentation.zip" -d extracted

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Find or Build APK
        run: |
          mkdir -p apk

          EXISTING_APK=$(find extracted -type f -name "*.apk" | head -n 1)

          if [ -n "$EXISTING_APK" ]; then
            cp "$EXISTING_APK" apk/Alavi-Portal.apk
          else
            GRADLE_FILE=$(find extracted -type f -name gradlew | head -n 1)

            if [ -z "$GRADLE_FILE" ]; then
              echo "No APK or Gradle project found in ZIP"
              exit 1
            fi

            PROJECT_DIR=$(dirname "$GRADLE_FILE")
            cd "$PROJECT_DIR"
            chmod +x gradlew
            ./gradlew assembleDebug

            find . -type f -path "*/build/outputs/apk/*/*.apk" -exec cp {} "$GITHUB_WORKSPACE/apk/Alavi-Portal.apk" \; -quit
          fi

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Alavi-Portal-Android
          path: apk/*.apk
